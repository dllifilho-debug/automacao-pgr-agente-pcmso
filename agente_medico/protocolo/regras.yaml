    emite:
      - {exame: exame_clinico, periodicidade_meses: 6, momentos: [per]}
      - {exame: hemograma,     periodicidade_meses: 6, momentos: [adm, per, MR, dem]}
    base_normativa: "Asfalto/betume é cancerígeno com CAS no inventário do PGR → NR-07 Anexo V
      (itens 2.1, 3.1.1 e 4.1.1: exames complementares obrigatórios sem avaliação ambiental);
      sem indicador biológico no Anexo I, o complementar é o do 7.5.18 (a critério do médico,
      tecnicamente justificado) e o clínico em intervalo menor pelo 7.5.8 II a 1. NR-15 Anexo
      13 trata o betume como cancerígeno. [DERIVADO — 7/7 GHEs de impermeabilização com
      asfalto em 6 matrizes do acervo, inclusive RQ.61 Viverde validada: clínico 6M e
      hemograma 6M]. Sem t,t-mucônico nem reticulócitos: regime do benzeno exige benzeno ou
      mistura ≥1% (NR-15 Anexo 13-A item 2; NR-07 Anexo V 4.2.1)."
    resumo_clinico: "Asfalto (betume, cancerígeno) no PGR → exame clínico e hemograma a cada 6 meses. NR-07, Anexo V (cancerígenos) e item 7.5.18; segue as 7 matrizes de impermeabilização do acervo."
