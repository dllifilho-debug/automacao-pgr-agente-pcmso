      R-BIO-04-monoxido_de_carbono emite o mesmo exame e a consolidação une."
    resumo_clinico: "Manta asfáltica aplicada a quente (caldeira e maçarico) gera monóxido de carbono → carboxihemoglobina no periódico, a cada 6 meses. NR-07, Anexo I, Quadro 1. O PGR nem sempre inventaria o CO; segue as matrizes de impermeabilização."
    status: DERIVADO

