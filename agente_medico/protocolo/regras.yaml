      Vistamerica GHE 18 (08/12/25) sem; planilha Dra. Patrícia (versão atualizada, set/2026):
      'POLICORTE, SOLDA → COHb 6M PER'; 22 matrizes de set/2026: 22/26 cargos de solda com COHb,
      sem em Vistamerica GHE 17 (16/09/26) e Serrinha 201 GHE 13; nenhum dos PGRs CMO inventaria
      o CO]. Gatilho
      `solda_indicador` (manganês ou fumos metálicos) [INTERPRETADO], o mesmo de R-VIS-01-solda;
      gatilho pela fonte geradora declarada é DT própria. Quando o PGR inventaria o CO,
      R-BIO-04-monoxido_de_carbono emite o mesmo exame e a consolidação une."
    resumo_clinico: "Solda gera monóxido de carbono → carboxihemoglobina no periódico, a cada 6 meses. NR-07, Anexo I, Quadro 1. O PGR não inventaria o CO; segue as matrizes de serralheria e a planilha atualizada da Dra. Patrícia."
    status: DERIVADO

  - id: R-PKG-BZ
    quando: benzeno
    emite:
      - {exame: hemograma,           periodicidade_meses: 6, momentos: [adm, per, MR, dem]}
      - {exame: reticulocitos,       periodicidade_meses: 6, momentos: [adm, per, MR, dem]}
      - {exame: acido_transmuconico, periodicidade_meses: 6, momentos: [per]}
    base_normativa: "Protocolo Dra. Carolini R-PKG-BZ — benzeno identificado na composição
      (via FDS, mesmo <5%, mesmo via CAS de aromáticos genéricos R-FDS-04) → pacote benzeno.
      hemograma 6M [adm/per/MR/dem] e t,t-mucônico 6M [per] [VALIDADO — R-PKG-BZ].
      reticulócitos: momentos [adm/per/MR/dem] do protocolo; periodicidade 6M
      [DERIVADO — IN MTP 2/2021 Anexo X, 2.1.3 (hemograma com plaquetas e reticulócitos) e 3.1
      (admissional, periódico a intervalos máximos de 6 meses, mudança de função, demissional)].
      Dispara por identidade de agente, agnóstico à fonte (4ª fonte D-ARQ-35) e à materialidade.
      Procedência (02/10/2026): o regime obrigatório tem limiar — NR-07 Anexo V 2.1 (CAS no
      inventário, mistura >=0,1%) e 4.2.1 (IN SSST 2/1995, revogada pela IN MTP 2/2021 art. 294,
      V; vigilância no Anexo X da IN 2/2021); NR-15 Anexo 13-A item 2 (>=1%); NR-07 Anexo I
      Quadro 1 (S-PMA ou t,t-mucônico). Abaixo de 0,1% o pacote é conduta do protocolo pelo
      NR-07 7.5.18, não obrigação do Anexo V. Sem benzeno identificado não dispara; a FDS
      faltante vira pendência R-FDS-07."
    resumo_clinico: "Benzeno na composição de produto (FDS), mesmo em baixa concentração → hemograma e reticulócitos a cada 6 meses em todos os momentos, e ácido trans,trans-mucônico no periódico semestral. Protocolo da coordenação."
    status: VALIDADO

  # R-PKG-BZ-PRES [INTERPRETADO] (D-ARQ-68 cl.5): solvente de petróleo no PGR sem a FDS
  # dele e sem benzeno identificado → pacote do benzeno sob presunção protetiva, com
  # pendência ao elaborador e matriz PARCIAL até a FDS responder.
  - id: R-PKG-BZ-PRES
    quando: benzeno_a_confirmar
    quando_ausente: {presumir_true: [benzeno_a_confirmar]}
    emite:
      - {exame: hemograma,           periodicidade_meses: 6, momentos: [adm, per, MR, dem]}
      - {exame: reticulocitos,       periodicidade_meses: 6, momentos: [adm, per, MR, dem]}
      - {exame: acido_transmuconico, periodicidade_meses: 6, momentos: [per]}
      - {exame: exame_clinico,       periodicidade_meses: 6, momentos: [per]}
    base_normativa: "R-PKG-BZ-PRES [INTERPRETADO]. Presunção protetiva (D-ARQ-68 cl.5): o
      PGR declara solvente derivado de petróleo (aguarrás, querosene, solvente de nafta —
      `contaminantes_a_confirmar: [benzeno]`) sem a FDS dele, e o benzeno não foi
      identificado. Norma: NR-07 Anexo V 2.1 delega ao inventário do PGR as substâncias
      cancerígenas com CAS, e a NR-01 não obriga o inventário a listar contaminante de
      mistura; nenhum dispositivo obriga o pacote sem benzeno identificado (NR-15 Anexo 13-A
      item 2, >=1%; IN MTP 2/2021 Anexo X no campo do regime) — o exame entra pelo NR-07
      7.5.18. Exames e momentos iguais aos da R-PKG-BZ (IN MTP 2/2021 Anexo X 2.1.3 e 3.1;
      NR-07 Anexo I Quadro 1); clínico 6M como na R-CLI-05 para o benzeno. Todo risco desses
      solventes IRRELEVANTE → sem presunção (corte da R-BIO-05 para cancerígeno). Precedente
      (D-ARQ-22 nível 2), medido em 03/10/2026: pacote do benzeno em 24 de 46 blocos de
      pintura do acervo; no mesmo PGR CMO Vistamerica 2026-07-28, GHE 24 (aguarrás,
      destilados, nafta, querosene, thinner; BAIXO) com o pacote e GHE 22 (só tinta) sem;
      Aurora 27.08.26 GHE 18 (BAIXO) com; Porto Araras I GHE-14 (querosene IRRELEVANTE) sem.
      Contra: WVM 05 Entreverdes, revisão de 24.09.26 retirou o pacote com o mesmo PGR. Com a
      FDS anexada, o pacote só sai se ela declarar benzeno (R-PKG-BZ)."
    resumo_clinico: "Solvente derivado de petróleo (aguarrás, querosene, nafta) no PGR, com risco acima de irrelevante e sem a FDS do produto → pacote do benzeno presumido (hemograma e reticulócitos a cada 6 meses, ácido trans,trans-mucônico e clínico semestrais), até a FDS confirmar ou afastar o benzeno. Decisão interpretada, conferir primeiro."
    status: INTERPRETADO

  # R-BIO-05 [INTERPRETADO] (DT-003EB-02): nas R-BIO-04 do Quadro 1 (IBE/EE),
  # mencao_documental troca o indicador por observação quando todo risco do
  # agente no GHE vem classificado IRRELEVANTE na matriz P×S do PGR. BAIXO
  # emite (decisão do Diovanni, 24/09/2026). Quadro 2 (IBE/SC) sem a chave.
  # Emenda D-ARQ-86 (ratificada 25/09/2026): niveis_com_medicao_abaixo_acao
  # dispensa em BAIXO só com medição do agente no GHE abaixo do nível de ação
  # (NR-07 7.5.12 "b" c/c NR-09 9.6.1 "b": metade do LT da NR-15 Anexo 11).
  # Sem medição, BAIXO emite. Só nos 21 agentes com lt_nr15 que não são
  # cancerígenos IARC 1/2A; tricloroetileno, 1,3-butadieno, óxido de etileno,
  # diclorometano, estireno, dimetilformamida e tetracloroetileno ficam sem a
  # chave — cancerígeno recebe o indicador com qualquer medição (Diovanni, 25/09/2026).
  - id: R-BIO-03
    quando: manganes
    emite:
      - {exame: manganes_sangue, periodicidade_meses: 6, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini R-BIO-03 [VALIDADO] — qualquer exposição
      confirmada a manganês → manganês no sangue semestral em adm + per + MR,
      independente do LT. Manganês não consta no Anexo I (Quadros 1 e 2) da NR-07
      (Portaria MTP 567/2022), por isso fica fora de R-BIO-04 e de R-BIO-05. Base conferida
      [DERIVADO]: NR-15 Anexo 12, 'Manganês e seus compostos' (Portaria DNSST 08/1992),
      item 7 — obrigatório a todo exposto, 'independentemente dos limites de tolerância',
      exames pré-admissionais e periódicos (6 meses a anual na superfície) e 'análises
      biológicas de sangue'; item 2 inclui 'fabricação e uso de eletrodos de solda'.
      [INTERPRETADO]: o analito (Mn no sangue), o 6M fixo e o momento MR são conduta do
      protocolo — a norma fala em análise de sangue, faixa 6-12M e adm/per. Momentos e
      periodicidade conferidos contra o gabarito Aurora Lago das Rosas 27.08.26 (Dra.
      Patrícia, GHE 16 SERRALHERIA: 'Manganês no sangue (ADM, PER 6 meses, MRO)')."
    resumo_clinico: "Manganês no PGR → manganês no sangue a cada 6 meses (admissional, periódico e mudança de risco). A NR-15, Anexo 12 exige acompanhamento de todo exposto; protocolo da coordenação."
    status: VALIDADO

