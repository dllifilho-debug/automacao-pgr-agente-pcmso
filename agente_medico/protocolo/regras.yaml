regras:
  - id: R-PKG-ATIVCRIT
    quando: atividade_critica
    emite:
      - {exame: hemograma,       periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: glicemia,        periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: audiometria,     periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: acuidade_visual, periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: ecg,             periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini — rastreio de comorbidade para atividade crítica"
    status: VALIDADO

  - id: R-VIB-01
    quando: vibracao_corpo_inteiro
    emite:
      - {exame: rx_coluna_lombo_sacra, periodicidade_meses: 0, momentos: [adm, MR]}
    base_normativa: "Protocolo Dra. Carolini — vibração corpo inteiro; ADM e mudança de risco (sem demissional). Matriz Patrícia registra ADM+DEM; protocolo vivo prevalece (D-ARQ-16)"
    status: VALIDADO

  - id: R-AUD-01
    quando: ruido_acima_acao
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini R-AUD-01 — audiometria 12M adm/per/MR por gatilho. Gatilho ruido implementado; motorista equip. pesado e ototoxico diferidos. Altura/confinado vem de R-PKG-ATIVCRIT; vibracao de R-VIB-02"
    status: VALIDADO

  - id: R-AUD-02
    quando: ruido_acima_acao
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [dem]}
    base_normativa: "Protocolo Dra. Carolini R-AUD-02 — demissional de audiometria com ruido acima da acao. Branch ruido+ototoxico+vibracao diferido (depende de is_ototoxico)"
    status: VALIDADO

  - id: R-VIB-02
    quando: vibracao_corpo_inteiro
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini R-VIB-02 — qualquer vibracao -> audiometria 12M mesmo abaixo do nivel de acao. Maos-bracos diferido (falta primitivo)"
    status: VALIDADO

