regras:
  - id: R-CLI-01
    quando: todo_trabalhador
    emite:
      - {exame: exame_clinico, periodicidade_meses: 12,
         momentos: [adm, per, MR, RT, dem]}
    base_normativa: "Protocolo Dra. Carolini R-CLI-01 [VALIDADO] — clínico anual
      é o piso, vale inclusive para administrativo sem risco. Momentos:
      R-TEMP-01 (5 momentos) [DERIVADO — medição da matriz humana Fascino
      08/07/26, 19/19 GHEs em ADM/PER/MRO/RET/DEM]"
    resumo_clinico: "Exame clínico anual para todos os trabalhadores, em todos os momentos (admissional, periódico, retorno, mudança de risco e demissional). É o piso do PCMSO (NR-07); protocolo da coordenação."
    status: VALIDADO

  - id: R-CLI-03
    quando: manganes
    emite:
      - {exame: exame_clinico, periodicidade_meses: 6, momentos: [per]}
    base_normativa: "Protocolo Dra. Carolini R-CLI-03 [VALIDADO] — manganês, único agente
      fora do Anexo I da NR-07 que dispara clínico semestral. [DERIVADO]: NR-15 Anexo 12,
      'Manganês e seus compostos' (Portaria DNSST 08/1992), item 7 — exames periódicos
      obrigatórios a todo exposto independentemente do LT, 'de 6 (seis) meses a
      anualmente para os trabalhadores de superfície'. [INTERPRETADO]: 6M fixo é a ponta
      protetiva da faixa. Emite só o periódico 6M: os demais momentos vêm de R-CLI-01, e a
      consolidação (D-ARQ-39) une os momentos e fica com a menor periodicidade."
    resumo_clinico: "Manganês no PGR → exame clínico a cada 6 meses. A NR-15, Anexo 12 (manganês) exige exames periódicos de 6 meses a 1 ano para todo exposto; o protocolo adota 6 meses."
    status: VALIDADO

  - id: R-CLI-05
    quando: {ou: [cancerigeno_com_ibe, agente_ibe_moderado_ou_acima]}
    emite:
      - {exame: exame_clinico, periodicidade_meses: 6, momentos: [per]}
    base_normativa: "Sucede R-CLI-02 (DEPRECATED). NR-07: clínico periódico anual, menor a
      critério do médico — a norma não fixa gatilho para o semestral. [DERIVADO — matriz
      Dra. Patrícia, Aurora 27/08/26]: 6M em GHE 11 (agentes do Anexo I MODERADO) e 18
      (benzeno); 12M onde os agentes do Anexo I são BAIXO/IRRELEVANTE (Porto Araras I
      06/07/26, Vila Brasil 26/08/26) e onde só poeira/sílica é MODERADO (todos os pares).
      Emite só o periódico 6M; os demais momentos vêm de R-CLI-01 (consolidação D-ARQ-39)."
    resumo_clinico: "Agente cancerígeno com indicador biológico na NR-07, ou agente do Anexo I da NR-07 com risco moderado ou maior no PGR → exame clínico a cada 6 meses. A NR-07 permite intervalo menor que o anual a critério médico; o gatilho segue a matriz da Dra. Patrícia (Aurora)."
    status: DERIVADO

  - id: R-PSY-02
    quando: todo_trabalhador
    emite:
      - {exame: avaliacao_psicossocial,  periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: avaliacao_saude_mental,  periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "NR-01 itens 1.5.3.1.4, 1.5.3.2.1 e 1.5.4.4.5.3 (redação da
      Portaria MTE 1.419/2024; vigência 26/05/2026 pela Portaria MTE 765/2025) —
      a norma obriga inventariar e gerenciar o fator de risco psicossocial (FRPRT),
      mas NÃO prescreve exame. A conduta era [DERIVADO — corpus de 6 matrizes
      pós-vigência, 5 clientes, 2 médicas, 284 cargos, 99% de cobertura; grupo de
      controle de 13 matrizes pré-vigência em ~0%], incondicional (não condicionada
      à declaração no PGR): medido PGR sem FRPRT cuja matriz emite mesmo assim
      (Ricco 2026 Adm) — silêncio documental não desobriga, postura D-ARQ-68.
      Sucede R-PSY-01 (DEPRECATED): mudança de escopo de aplicação
      (condicionada → incondicional) exige ID nova.
      [DEPRECATED — fundamento refutado por n=2 pós-protocolo-de-setembro/2026,
      mesmo padrão de D-ARQ-81 aplicado a R-AUD-04]: Ricco Hetrin 14/09 (validada)
      sai com zero exame psicossocial em 28/28 cargos — PGR correspondente lido
      por completo (197 páginas), zero ocorrência de marcador de inventário
      psicossocial, inclusive no Pedreiro com risco de altura documentado no
      próprio PGR (refuta cascata por atividade crítica); CMO Varandas Flamboyant
      16/09 (validada) sai incondicional em todo GHE, marcador presente no PGR.
      Confirmado pelo Diovanni: quem decide é o engenheiro que elabora o PGR
      (inclui ou não a seção de inventário psicossocial), não classificação de
      risco nem atividade — o corpus que fundamentava a incondicionalidade media
      protocolo anterior a esta distinção. COM sucessora, diferente do molde
      'sem sucessora' de D-ARQ-81 cl.2: R-PSY-03."
    status: DEPRECATED

  - id: R-PSY-03
    quando: psicossocial
    emite:
      - {exame: avaliacao_psicossocial,  periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: avaliacao_saude_mental,  periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "NR-01 itens 1.5.3.1.4, 1.5.3.2.1 e 1.5.4.4.5.3 (mesma base de
      R-PSY-02) — a norma obriga inventariar/gerenciar o FRPRT, não prescreve
      exame; conduta [DERIVADO], igual a R-PSY-02. Sucede R-PSY-02 (DEPRECATED):
      mudança de escopo de aplicação (incondicional → condicionada à presença da
      seção de inventário psicossocial no PGR, primitivo 'psicossocial',
      detectar_psicossocial em extracao_pgr.py) exige ID nova, mesma convenção de
      R-PSY-01→R-PSY-02. [INTERPRETADO — n=2, mesma classe de obra (construção
      civil) nos dois PGRs-âncora; risco residual não resolvido: granularidade
      medida é por PGR inteiro, variação por GHE dentro do mesmo PGR não
      descartada por falta de caso. Ver DT-(sessão não numerada, branch
      claude/youthful-lamport-3kfkog)-01 em PENDENCIAS_CLINICAS.md]."
    resumo_clinico: "PGR com inventário de riscos psicossociais → avaliação psicossocial e avaliação médica de saúde mental, anuais. A NR-01 manda identificar e gerenciar esses riscos, mas não define exame; segue as matrizes das coordenadoras. A planilha atualizada da Dra. Patrícia restringe a avaliação psicossocial a trabalho em altura e espaço confinado — confirmar."
    # [DEPRECATED — 30/09/2026, decisão do Diovanni sobre a norma] Os dois exames
    # têm fundamentos diferentes e passam a ter gatilhos diferentes: a avaliação
    # psicossocial vem da NR-35 35.4.4 e da NR-33 33.5.19.1 (R-PSY-04); a saúde
    # mental, do inventário psicossocial do PGR (R-PSY-05). Mudança de escopo
    # exige ID nova (convenção R-PSY-01→02→03).
    status: DEPRECATED

  - id: R-PSY-04
    quando: aptidao_psicossocial_nr
    emite:
      - {exame: avaliacao_psicossocial, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "NR-35 item 35.4.4 (trabalho em altura: a avaliação do estado de saúde
      considera 'patologias que poderão originar mal súbito e queda de altura, bem como
      os fatores psicossociais') e NR-33 item 33.5.19.1 (espaço confinado: 'avaliados
      quanto à aptidão física e mental, considerando os fatores de riscos psicossociais'),
      textos conferidos em normas/ (nr-35-atualizada-2025-1.pdf, nr-33-atualizada-2022-
      _retificada.pdf) em 30/09/2026. Avaliação feita por psicólogo nos exames
      ocupacionais conforme as NRs: Resolução CFP n.º 2/2022 (DOU 26/01/2022). A norma
      exige considerar os fatores psicossociais na aptidão; o exame é a forma da
      coordenação. Dispara pela atividade, com ou sem inventário psicossocial no PGR.
      Momentos da R-PSY-03 mantidos. [DERIVADO — norma + gabarito T65 24.09.26 (PDF com
      adequação ao protocolo psicossocial de 14/09/2026) + planilha da Dra. Patrícia].
      Equipamento pesado fora: nenhuma NR o associa a fatores psicossociais. Brigada de
      inflamáveis (NR-20 20.15.6) sem agente no vocabulário — DT própria."
    resumo_clinico: "Trabalho em altura ou em espaço confinado → avaliação psicossocial anual. A NR-35 (item 35.4.4) e a NR-33 (item 33.5.19.1) mandam considerar os fatores psicossociais na avaliação de aptidão; a avaliação é feita por psicólogo (Resolução CFP n.º 2/2022)."
    # [DEPRECATED — 07/10/2026, decisão do Diovanni] Altura passa a exigir o inventário
    # psicossocial no PGR (R-PSY-06): matrizes das médicas Hetrin 14/09 e 30/09 (PGR
    # sem inventário, altura sem psicossocial) e Vila Brasil 24/09 (com inventário,
    # mantida nos 9 GHEs com altura/espaço confinado, riscada nos 17 sem), e a folha
    # da Dra. Carolini (ramo da altura parte do risco psicossocial). Mudança de escopo
    # exige ID nova (convenção R-PSY-01→02→03→04).
    status: DEPRECATED

  - id: R-PSY-06
    quando: aptidao_psicossocial_com_inventario
    emite:
      - {exame: avaliacao_psicossocial, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "NR-35 item 35.4.4 (a avaliação de saúde de quem trabalha em altura
      segue a NR-07, item 7.5.3, 'considerando patologias que poderão originar mal
      súbito e queda de altura, bem como os fatores psicossociais') e NR-33 item
      33.5.19.1 (espaço confinado: 'aptidão física e mental, considerando os fatores
      de riscos psicossociais'), textos conferidos em normas/ em 07/10/2026; nenhuma
      das duas prescreve exame separado e a NR-07 não menciona fatores psicossociais.
      Sucede R-PSY-04 (DEPRECATED). Altura: só com inventário psicossocial no PGR
      [DERIVADO — precedente das médicas: Hetrin 14/09 (0 de 28 cargos, Pedreiro com
      altura) e 30/09 (0 de 36; encarregados com altura), PGR sem inventário; Vila
      Brasil 24/09, com inventário, psicossocial mantida nos 9 GHEs com altura/espaço
      confinado e riscada nos 17 sem; folha da Dra. Carolini de 07/10/2026, ramo da
      altura a partir do risco psicossocial]. Espaço confinado: sem condição de
      inventário [INTERPRETADO — a folha o escreve em linha própria; nenhum caso do
      acervo separa espaço confinado de altura]. PGR sem inventário emitido a partir
      de 26/05/2026 gera o alerta de R-PSY-07 (NR-01 item 1.5.3.1.4)."
    resumo_clinico: "Trabalho em altura com inventário de riscos psicossociais no PGR, ou trabalho em espaço confinado → avaliação psicossocial anual. A NR-35 (item 35.4.4) e a NR-33 (item 33.5.19.1) mandam considerar os fatores psicossociais na aptidão; a exigência do inventário para a altura segue as matrizes das médicas."
    status: DERIVADO

  - id: R-PSY-05
    quando: psicossocial
    emite:
      - {exame: avaliacao_saude_mental, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "NR-01 itens 1.5.3.1.4 e 1.5.3.2.1 (o PGR inventaria e gerencia os
      fatores de risco psicossociais) e NR-07 item 7.5.1 (o PCMSO considera os riscos
      identificados e classificados pelo PGR). Nenhuma NR prescreve o exame. Mesmo
      gatilho da R-PSY-03 (seção de inventário psicossocial no PGR,
      detectar_psicossocial). [INTERPRETADO — precedente: 22 matrizes da Dra. Patrícia de
      14 a 24/09/2026, saúde mental em 1.001 de 1.113 cargos; o T65 24.09.26 a dá aos 18
      GHEs]."
    resumo_clinico: "PGR com inventário de riscos psicossociais → avaliação médica de saúde mental anual, para todos. A NR-01 manda gerenciar esses riscos e a NR-07 manda o PCMSO considerá-los, mas nenhuma norma define exame; segue as matrizes das coordenadoras — confirmar."
    # [DEPRECATED — 09/10/2026, decisão do Diovanni, solução D] A saúde mental passa a
    # exigir inventário avaliado com fator no corte "moderado ou acima" (R-PSY-08). Mudança
    # de escopo exige ID nova (convenção R-PSY-01→02→03).
    status: DEPRECATED

  - id: R-PSY-08
    quando: psicossocial_moderado
    emite:
      - {exame: avaliacao_saude_mental, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "NR-01 itens 1.5.3.1.4 e 1.5.3.2.1 (o PGR inventaria e gerencia os
      fatores de risco psicossociais) e NR-07 item 7.5.1 (o PCMSO considera os riscos
      identificados e classificados pelo PGR); nenhuma NR prescreve o exame. Sucede
      R-PSY-05 (DEPRECATED). Gatilho: inventário psicossocial AVALIADO (linha de fator com
      nível, não só a citação do FRPRT) com ao menos um fator no corte 'moderado ou acima'
      de niveis_risco.yaml (avaliar_inventario_psicossocial). [DERIVADO — anotação das
      médicas no acervo: folha da Dra. Carolini de 07/10/2026 ('Risco Psicossocial →
      Moderado = Avaliação Médica de Saúde Mental', leitura do '≥' incerta); matriz da
      Sinduscon 27.08.26 sem saúde mental para PGR que só anuncia a avaliação]. Medido em
      09/10/2026: os 10 inventários avaliados do acervo têm fator MODERADO; 4 PGRs só citam
      o FRPRT (Sinduscon 27.08.26, SPE QD. E-13, Verde Maris, Seconci REV4)."
    resumo_clinico: "Inventário de riscos psicossociais avaliado no PGR, com algum fator moderado ou acima → avaliação médica de saúde mental anual, para todos. A NR-01 manda gerenciar esses riscos e a NR-07 manda o PCMSO considerá-los, mas nenhuma norma define exame; o corte segue a anotação da Dra. Carolini."
    status: DERIVADO

  - id: R-PKG-ATIVCRIT
    quando: atividade_critica
    emite:
      - {exame: hemograma,       periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: glicemia,        periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: audiometria,     periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: acuidade_visual, periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: ecg,             periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini — rastreio de comorbidade para atividade crítica"
    resumo_clinico: "Atividade crítica (trabalho em altura, espaço confinado ou operação de equipamento pesado) → hemograma, glicemia, audiometria, acuidade visual e ECG anuais, para rastrear condições que ponham o trabalhador ou terceiros em risco. Protocolo da coordenação."
    status: VALIDADO

  - id: R-VIS-01-solda
    quando: solda_indicador
    emite:
      - {exame: acuidade_visual, periodicidade_meses: 12, momentos: [adm, per, MR, dem]}
    base_normativa: "R-VIS-01 [VALIDADO — entrevista Dra. Carolini]: soldador é o único caso
      de acuidade visual também no demissional. Nenhuma NR exige acuidade visual para solda
      (conferido nos textos oficiais do acervo); entra pelo NR-07 7.5.18 — risco que justifica:
      radiação não ionizante do arco (UV/IR). [DERIVADO — PCMSO-modelo Dra. Carolini SECONCI
      05/2024 (acuidade para expostos a solda) e 7/9 serralherias do acervo com DEM, inclusive
      RQ.61 Viverde GHE 10; planilha Dra. Patrícia (versão atualizada, set/2026): 'SOLDA →
      acuidade ADM, PER 12M, MR, DEM'; 22 matrizes de set/2026: 23/26 cargos de solda com DEM].
      Gatilho por manganês/fumos metálicos [INTERPRETADO] — ver
      `solda_indicador`."
    resumo_clinico: "Solda no GHE → acuidade visual anual, também no demissional, pela radiação ultravioleta e infravermelha do arco. Nenhuma NR exige; entra pela NR-07, item 7.5.18 (a critério do médico). Protocolo da coordenação e matrizes de serralheria."
    status: DERIVADO

  - id: R-VIS-02
    quando: cargo_porteiro
    emite:
      - {exame: acuidade_visual, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "R-VIS-02 [VALIDADO — entrevista Dra. Carolini]: porteiro recebe acuidade
      visual em adm/per/MR, sem demissional (também R-PKG-PORT). Nenhuma NR exige; NR-07
      7.5.18. PCMSO-modelo Dra. Carolini SECONCI 05/2024: acuidade para 'porteiros, vigias'.
      Precedente: 10/12 GHEs de portaria/vigia/controle de acesso do acervo com acuidade
      (ADM, PER, MRO); sem: WVM Entreverdes 19 e Porto Araras I 15."
    resumo_clinico: "Porteiro → acuidade visual anual, sem demissional. Nenhuma NR exige; NR-07, item 7.5.18. Protocolo da coordenação."
    status: VALIDADO

  - id: R-VIS-03
    quando: cimento_asfaltico
    emite:
      - {exame: acuidade_visual, periodicidade_meses: 12, momentos: [adm, per, MR, dem]}
    base_normativa: "Impermeabilização com manta asfáltica a quente (maçarico) — mesma
      lógica da solda: exposição ocular a chama e radiação IR; NR-07 7.5.18.
      [INTERPRETADO — prioridade na revisão de saída]: RQ.61 Viverde GHE 09 (validada) e Aurora
      GHE 22 pedem DEM; Flamboyant 20, Vistamerica 20/21 e Varandas Bueno 18/38 não (2/7).
      Decisão do Diovanni (26/09/2026) pela matriz validada."
    resumo_clinico: "Manta asfáltica aplicada a quente (maçarico) → acuidade visual anual, também no demissional, pela exposição à chama e à radiação infravermelha. NR-07, item 7.5.18. Segue a matriz validada do Viverde; outras matrizes não pedem o demissional — confirmar."
    status: INTERPRETADO

  - id: R-PKG-TRANSITO
    quando: transito_via_publica
    emite:
      - {exame: acuidade_visual, periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: audiometria,     periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "DT-003EB-01 classe (4) — PGR declara o risco 'Bater contra ou ser
      atingido por (trânsito)' (deslocamento/condução em via pública) -> acuidade visual +
      audiometria 12M adm/per/MR. [INTERPRETADO — prioridade na revisão de saída]: decisão do
      Diovanni (24/09/2026) sobre precedente medido — Patrícia, Vila Brasil Escritório
      26/08/26 (DIREÇÃO 'conduz carro de pequeno porte'; PATRIMÔNIO 'dirige veículos leves') e
      Carolini, SPE 0030 Fascino 08/07/26 (VENDAS): 3/3 GHEs com o risco recebem os dois
      exames; 0 dos outros 58 GHEs dos 3 PGRs pareados. Sem âncora em NR. Gatilho é o risco de
      trânsito declarado, não o cargo, e o veículo é leve — distinção das regras de motorista
      e de equipamento pesado registrada no PROTOCOLO §6. Viés declarado (D-ARQ-81 cl.1):
      construção civil, 2 médicas, n=3 GHEs."
    resumo_clinico: "PGR com risco de trânsito (condução ou deslocamento em via pública) → acuidade visual e audiometria anuais. Nenhuma NR exige; segue matrizes da Dra. Patrícia e da Dra. Carolini — confirmar."
    status: INTERPRETADO

  - id: R-VIB-01
    quando: vibracao_corpo_inteiro
    emite:
      - {exame: rx_coluna_lombo_sacra, periodicidade_meses: 0, momentos: [adm, MR]}
    base_normativa: "Protocolo Dra. Carolini — vibração corpo inteiro; ADM e mudança de risco (sem demissional). Matriz Patrícia registra ADM+DEM; protocolo vivo prevalece (D-ARQ-16)"
    resumo_clinico: "Vibração de corpo inteiro → RX de coluna lombossacra no admissional e na mudança de risco. Protocolo da coordenação."
    status: VALIDADO

  - id: R-AUD-01
    quando: {ou: [ruido_acima_acao, motorista_equipamento_pesado, ototoxico]}
    quando_ausente: {presumir_true: [ruido_acima_acao]}
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini R-AUD-01 — audiometria 12M adm/per/MR
      por gatilho (ruido acima acao, motorista equip. pesado ou ototoxico).
      Altura/confinado vem de R-PKG-ATIVCRIT; vibracao de R-VIB-02. Perna do
      ruído: [DERIVADO — NR-07 Anexo II itens 2 e 4.1 'a'/'b'; momento MR por
      7.5.6 'd' + 7.5.7, a contrario 7.5.15]. Pernas motorista_equipamento_pesado
      e ototoxico: [VALIDADO] — conduta da Dra. Carolini além do item 2, sem
      âncora normativa própria. Silêncio do PGR sobre a quantificação do ruído
      (NR-09 9.4.1/9.4.2, avaliação condicional) admite presunção protetiva
      declarada em quando_ausente.presumir_true — regra sai marcada
      [INTERPRETADO — prioridade na revisão de saída] nesse trecho (D-ARQ-68 cl.5)."
    resumo_clinico: "Ruído acima do nível de ação, operação de equipamento pesado ou agente ototóxico → audiometria anual. Para o ruído, NR-07, Anexo II; os outros dois gatilhos são protocolo da coordenação."
    status: VALIDADO

  - id: R-AUD-02
    quando: {ou: [ruido_acima_acao, {e: [ruido, ototoxico, vibracao_qualquer]}]}
    quando_ausente: {presumir_true: [ruido_acima_acao]}
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [dem]}
    base_normativa: "Protocolo Dra. Carolini R-AUD-02 — demissional de audiometria
      com ruido acima da acao OU combinacao ruido+ototoxico+vibracao (D-ARQ-13/16).
      Perna do ruído: [DERIVADO — NR-07 Anexo II item 4.1 'c']. Perna
      e(ruido, ototoxico, vibracao_qualquer): [VALIDADO] — sem âncora normativa.
      Mesma presunção protetiva de R-AUD-01 sobre ruido_acima_acao, mesma marca
      [INTERPRETADO — prioridade na revisão de saída] (D-ARQ-68 cl.5); a perna
      'e' NÃO está na allowlist de presunção — ausência ali continua bloqueante."
    resumo_clinico: "Ruído acima do nível de ação, ou ruído combinado com agente ototóxico e vibração → audiometria também no demissional. Para o ruído, NR-07, Anexo II, item 4.1; a combinação é protocolo da coordenação."
    status: VALIDADO

  - id: R-AUD-04
    quando: todo_trabalhador
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [adm, per, MR, dem]}
    base_normativa: "NR-07 Anexo II 4.1: 'na admissão; anualmente; na demissão'
      [DERIVADO] crava 12M + adm + dem. O UNIVERSO da norma é o item 2 (acima do
      nível de ação conforme o PGR); estender a todo trabalhador e incluir MRO é
      [INTERPRETADO — revisão de saída], apoiado em matriz-precedente: Carolini
      07/2026 (SPE 0030) 41/41 audiometria e 38/41 com DEM; Patrícia 04/2025
      (RESERVA 0028) 44/44 audiometria, DEM confirmado 42, indeterminado 2 por
      forma ambígua de célula, sem DEM confirmado ZERO. Duas médicas, dois
      lados do corte NR-01 26/05/2026. LIMITE: ambos construção civil —
      reinspecionar no 1º PGR de saúde ou química (D-ARQ-06).
      [DEPRECATED — fundamento refutado por DT-003EY-01, sem sucessora — D-ARQ-81]:
      003.EY mediu 23 obras e refutou o precedente: universalidade em 7/23
      (6/23 com piso n_cargos ≥ 17), distribuição larga entre as não-universais.
      As duas matrizes-precedente de 003.EX eram justamente as duas em que a
      médica estendeu ao administrativo — artefato de amostra, não convergência.
      Momento DEM medido em 003.EZ passa a sair pela presunção de R-AUD-02
      (D-ARQ-68 cl.5), não mais por este piso incondicional."
    status: DEPRECATED

