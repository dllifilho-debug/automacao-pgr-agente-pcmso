    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto >10% e ≤50% LEO; 60M, encurta para 36M após 15 anos (D-ARQ-19); demissional se último > 2 anos"
    status: VALIDADO

