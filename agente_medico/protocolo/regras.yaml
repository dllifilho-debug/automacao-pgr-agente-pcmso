      qualquer que seja o composto. Precedente (D-ARQ-22 nível 2): 7 matrizes CMO com octoato
      de cobalto BAIXO/trivial no PGR anotam menção ('incluir no Word do PCMSO'); 6 não pedem
      o exame (Vistamerica 08.12.25, 28.07.26, 16.09.26; Floramazonia 19.08.26; Vaca Brava
      16.09.26; Casamerica 16.09.26); Aurora 27.08.26 pede cobalto na urina PER 6M e anota a
      menção no mesmo cargo — divergência consciente. Acima de BAIXO, sem caso no acervo."
