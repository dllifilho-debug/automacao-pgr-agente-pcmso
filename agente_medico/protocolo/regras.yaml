regras:
  - id: R-PKG-ATIVCRIT
    quando: atividade_critica
    emite:
      - {exame: hemograma,       periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: glicemia,        periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: audiometria,     periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: acuidade_visual, periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: ecg,             periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini — rastreio de comorbidade para atividade crítica"
    status: VALIDADO

  - id: R-VIB-01
    quando: vibracao_corpo_inteiro
    emite:
      - {exame: rx_coluna_lombo_sacra, periodicidade_meses: 0, momentos: [adm, MR]}
    base_normativa: "Protocolo Dra. Carolini — vibração corpo inteiro; ADM e mudança de risco (sem demissional). Matriz Patrícia registra ADM+DEM; protocolo vivo prevalece (D-ARQ-16)"
    status: VALIDADO

  - id: R-AUD-01
    quando: {ou: [ruido_acima_acao, motorista_equipamento_pesado, ototoxico]}
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini R-AUD-01 — audiometria 12M adm/per/MR por gatilho (ruido acima acao, motorista equip. pesado ou ototoxico). Altura/confinado vem de R-PKG-ATIVCRIT; vibracao de R-VIB-02"
    status: VALIDADO

  - id: R-AUD-02
    quando: {ou: [ruido_acima_acao, {e: [ruido, ototoxico, vibracao_qualquer]}]}
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [dem]}
    base_normativa: "Protocolo Dra. Carolini R-AUD-02 — demissional de audiometria com ruido acima da acao OU combinacao ruido+ototoxico+vibracao (D-ARQ-13/16)"
    status: VALIDADO

  - id: R-VIB-02
    quando: vibracao_qualquer
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini R-VIB-02 — qualquer vibracao (corpo inteiro ou maos-bracos) -> audiometria 12M mesmo abaixo do nivel de acao. Vibracao generica sem qualificar tipo -> Ausente -> bloqueante (D-ARQ-13/16)"
    status: VALIDADO

  - id: R-RX-01-adm
    quando: silica_asbesto_leo_ate_10
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 0
        momentos: [adm]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto CLSC ≤10% LEO: admissional; demissional se último exame > 2 anos (janela no agendador)"
    status: VALIDADO

  - id: R-RX-01-sem
    quando: silica_asbesto_sem_medicao
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 24
        periodicidade_apos_15a: 12
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto sem avaliação quantitativa; 24M, encurta para 12M após 15 anos (corte no agendador, D-ARQ-19); demissional se último > 1 ano"
    status: VALIDADO

  - id: R-RX-01-baixa
    quando: silica_asbesto_leo_10_50
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: 36
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto >10% e ≤50% LEO; 60M, encurta para 36M após 15 anos (D-ARQ-19); demissional se último > 2 anos"
    status: VALIDADO

  - id: R-RX-01-media
    quando: silica_asbesto_leo_50_100
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 36
        periodicidade_apos_15a: 24
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto >50% e ≤100% LEO; 36M, encurta para 24M após 15 anos (D-ARQ-19); demissional se último > 1 ano"
    status: VALIDADO

  - id: R-RX-01-alta
    quando: silica_asbesto_leo_acima_100
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 12
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto >100% LEO; 12M constante, sem corte de 15 anos; demissional se último > 1 ano"
    status: VALIDADO

  - id: R-RX-01-pnos
    quando: pnos
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "DEPRECATED (002.Y) — 60M único achatava as 4 faixas do Quadro 2. Sucedida por R-RX-01-pnos-ate10/-10a100/-acima100/-sem. Mantida por contrato de ID (rastreabilidade PCMSO). NR-07 Anexo III Quadro 2 (Portaria 567/2022)."
    status: DEPRECATED

  - id: R-RX-01-pnos-ate10
    quando: pnos_leo_ate_10
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 0
        momentos: [adm]
    base_normativa: "NR-07 Anexo III Quadro 2 (Portaria MTP 567/2022), conferido no MTE [DERIVADO] — PNOS CLSC ≤10% LEO (TLV-PNOS ACGIH 3 mg/m³ resp): só admissional."
    status: INTERPRETADO

  - id: R-RX-01-pnos-10a100
    quando: pnos_leo_10_100
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 0
        momentos: [adm]
    base_normativa: "NR-07 Anexo III Quadro 2 (Portaria MTP 567/2022) [DERIVADO] — PNOS 10% < CLSC ≤100% LEO: admissional. Repetição única após 5 anos a critério clínico NÃO materializada (lembrete operacional — DT-002Y-01). NÃO é 60M recorrente."
    status: INTERPRETADO

  - id: R-RX-01-pnos-acima100
    quando: pnos_leo_acima_100
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 2 (Portaria MTP 567/2022) [DERIVADO] — PNOS CLSC >100% LEO: adm + 60M (a cada 5 anos)."
    status: INTERPRETADO

  - id: R-RX-01-pnos-sem
    quando: pnos_sem_medicao
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 2 (Portaria MTP 567/2022) [DERIVADO] — PNOS sem avaliação quantitativa: adm + 60M."
    status: INTERPRETADO

  - id: R-RX-02
    quando: fumos_metalicos
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "Fumos metálicos → RX OIT 60M. SEM âncora no Anexo III da NR-07 (fumos não é Quadro 1 nem Quadro 2) — origem matriz Patrícia/analogia, não norma conferida [INTERPRETADO]. DT-002K-02 firmou risco por metal individual (Mn/Cr⁶⁺), não categoria 'fumos'. Roteamento correto depende da decomposição em metais — ver DT-D3-02."
    status: INTERPRETADO

  - id: R-PKG-BZ
    quando: benzeno
    emite:
      - {exame: hemograma,           periodicidade_meses: 6, momentos: [adm, per, MR, dem]}
      - {exame: reticulocitos,       periodicidade_meses: 6, momentos: [adm, per, MR, dem]}
      - {exame: acido_transmuconico, periodicidade_meses: 6, momentos: [per]}
    base_normativa: "Protocolo Dra. Carolini R-PKG-BZ — benzeno identificado na composição
      (via FDS, mesmo <5%, mesmo via CAS de aromáticos genéricos R-FDS-04) → pacote benzeno.
      hemograma 6M [adm/per/MR/dem] e t,t-mucônico 6M [per] [VALIDADO — R-PKG-BZ].
      reticulócitos: momentos [adm/per/MR/dem] do protocolo; periodicidade 6M
      [DERIVADO — analogia hemograma R-PKG-BZ] (protocolo declara momentos, não periodicidade).
      Dispara por identidade de agente, agnóstico à fonte (4ª fonte D-ARQ-35) e à materialidade."
    status: VALIDADO

