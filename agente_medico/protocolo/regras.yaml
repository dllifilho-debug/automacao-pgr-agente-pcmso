    base_normativa: "R-BIO-06 [INTERPRETADO]. NR-07 Anexo I Quadro 1 alcança 'Cobalto e seus
      compostos inorgânicos' (cobalto na urina, 15 µg/L, NE); o octoato de cobalto é sal
      orgânico e fica fora do texto literal. O exame entra pelo NR-07 7.5.18 (a critério do
