regras:
  - id: R-CLI-01
    quando: todo_trabalhador
    emite:
      - {exame: exame_clinico, periodicidade_meses: 12,
         momentos: [adm, per, MR, RT, dem]}
    base_normativa: "Protocolo Dra. Carolini R-CLI-01 [VALIDADO] — clínico anual
      é o piso, vale inclusive para administrativo sem risco. Momentos:
      R-TEMP-01 (5 momentos) [DERIVADO — medição da matriz humana Fascino
      08/07/26, 19/19 GHEs em ADM/PER/MRO/RET/DEM]"
    status: VALIDADO

  - id: R-PSY-02
    quando: todo_trabalhador
    emite:
      - {exame: avaliacao_psicossocial,  periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: avaliacao_saude_mental,  periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "NR-01 itens 1.5.3.1.4, 1.5.3.2.1 e 1.5.4.4.5.3 (redação da
      Portaria MTE 1.419/2024; vigência 26/05/2026 pela Portaria MTE 765/2025) —
      a norma obriga inventariar e gerenciar o fator de risco psicossocial (FRPRT),
      mas NÃO prescreve exame. A conduta era [DERIVADO — corpus de 6 matrizes
      pós-vigência, 5 clientes, 2 médicas, 284 cargos, 99% de cobertura; grupo de
      controle de 13 matrizes pré-vigência em ~0%], incondicional (não condicionada
      à declaração no PGR): medido PGR sem FRPRT cuja matriz emite mesmo assim
      (Ricco 2026 Adm) — silêncio documental não desobriga, postura D-ARQ-68.
      Sucede R-PSY-01 (DEPRECATED): mudança de escopo de aplicação
      (condicionada → incondicional) exige ID nova.
      [DEPRECATED — fundamento refutado por n=2 pós-protocolo-de-setembro/2026,
      mesmo padrão de D-ARQ-81 aplicado a R-AUD-04]: Ricco Hetrin 14/09 (validada)
      sai com zero exame psicossocial em 28/28 cargos — PGR correspondente lido
      por completo (197 páginas), zero ocorrência de marcador de inventário
      psicossocial, inclusive no Pedreiro com risco de altura documentado no
      próprio PGR (refuta cascata por atividade crítica); CMO Varandas Flamboyant
      16/09 (validada) sai incondicional em todo GHE, marcador presente no PGR.
      Confirmado pelo Diovanni: quem decide é o engenheiro que elabora o PGR
      (inclui ou não a seção de inventário psicossocial), não classificação de
      risco nem atividade — o corpus que fundamentava a incondicionalidade media
      protocolo anterior a esta distinção. COM sucessora, diferente do molde
      'sem sucessora' de D-ARQ-81 cl.2: R-PSY-03."
    status: DEPRECATED

  - id: R-PSY-03
    quando: psicossocial
    emite:
      - {exame: avaliacao_psicossocial,  periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: avaliacao_saude_mental,  periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "NR-01 itens 1.5.3.1.4, 1.5.3.2.1 e 1.5.4.4.5.3 (mesma base de
      R-PSY-02) — a norma obriga inventariar/gerenciar o FRPRT, não prescreve
      exame; conduta [DERIVADO], igual a R-PSY-02. Sucede R-PSY-02 (DEPRECATED):
      mudança de escopo de aplicação (incondicional → condicionada à presença da
      seção de inventário psicossocial no PGR, primitivo 'psicossocial',
      detectar_psicossocial em extracao_pgr.py) exige ID nova, mesma convenção de
      R-PSY-01→R-PSY-02. [INTERPRETADO — n=2, mesma classe de obra (construção
      civil) nos dois PGRs-âncora; risco residual não resolvido: granularidade
      medida é por PGR inteiro, variação por GHE dentro do mesmo PGR não
      descartada por falta de caso. Ver DT-(sessão não numerada, branch
      claude/youthful-lamport-3kfkog)-01 em PENDENCIAS_CLINICAS.md]."
    status: INTERPRETADO

  - id: R-PKG-ATIVCRIT
    quando: atividade_critica
    emite:
      - {exame: hemograma,       periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: glicemia,        periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: audiometria,     periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: acuidade_visual, periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: ecg,             periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini — rastreio de comorbidade para atividade crítica"
    status: VALIDADO

  - id: R-PKG-TRANSITO
    quando: transito_via_publica
    emite:
      - {exame: acuidade_visual, periodicidade_meses: 12, momentos: [adm, per, MR]}
      - {exame: audiometria,     periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "DT-003EB-01 classe (4) — PGR declara o risco 'Bater contra ou ser
      atingido por (trânsito)' (deslocamento/condução em via pública) -> acuidade visual +
      audiometria 12M adm/per/MR. [INTERPRETADO — prioridade na revisão de saída]: decisão do
      Diovanni (24/09/2026) sobre precedente medido — Patrícia, Vila Brasil Escritório
      26/08/26 (DIREÇÃO 'conduz carro de pequeno porte'; PATRIMÔNIO 'dirige veículos leves') e
      Carolini, SPE 0030 Fascino 08/07/26 (VENDAS): 3/3 GHEs com o risco recebem os dois
      exames; 0 dos outros 58 GHEs dos 3 PGRs pareados. Sem âncora em NR. Gatilho é o risco de
      trânsito declarado, não o cargo, e o veículo é leve — distinção das regras de motorista
      e de equipamento pesado registrada no PROTOCOLO §6. Viés declarado (D-ARQ-81 cl.1):
      construção civil, 2 médicas, n=3 GHEs."
    status: INTERPRETADO

  - id: R-VIB-01
    quando: vibracao_corpo_inteiro
    emite:
      - {exame: rx_coluna_lombo_sacra, periodicidade_meses: 0, momentos: [adm, MR]}
    base_normativa: "Protocolo Dra. Carolini — vibração corpo inteiro; ADM e mudança de risco (sem demissional). Matriz Patrícia registra ADM+DEM; protocolo vivo prevalece (D-ARQ-16)"
    status: VALIDADO

  - id: R-AUD-01
    quando: {ou: [ruido_acima_acao, motorista_equipamento_pesado, ototoxico]}
    quando_ausente: {presumir_true: [ruido_acima_acao]}
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini R-AUD-01 — audiometria 12M adm/per/MR
      por gatilho (ruido acima acao, motorista equip. pesado ou ototoxico).
      Altura/confinado vem de R-PKG-ATIVCRIT; vibracao de R-VIB-02. Perna do
      ruído: [DERIVADO — NR-07 Anexo II itens 2 e 4.1 'a'/'b'; momento MR por
      7.5.6 'd' + 7.5.7, a contrario 7.5.15]. Pernas motorista_equipamento_pesado
      e ototoxico: [VALIDADO] — conduta da Dra. Carolini além do item 2, sem
      âncora normativa própria. Silêncio do PGR sobre a quantificação do ruído
      (NR-09 9.4.1/9.4.2, avaliação condicional) admite presunção protetiva
      declarada em quando_ausente.presumir_true — regra sai marcada
      [INTERPRETADO — prioridade na revisão de saída] nesse trecho (D-ARQ-68 cl.5)."
    status: VALIDADO

  - id: R-AUD-02
    quando: {ou: [ruido_acima_acao, {e: [ruido, ototoxico, vibracao_qualquer]}]}
    quando_ausente: {presumir_true: [ruido_acima_acao]}
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [dem]}
    base_normativa: "Protocolo Dra. Carolini R-AUD-02 — demissional de audiometria
      com ruido acima da acao OU combinacao ruido+ototoxico+vibracao (D-ARQ-13/16).
      Perna do ruído: [DERIVADO — NR-07 Anexo II item 4.1 'c']. Perna
      e(ruido, ototoxico, vibracao_qualquer): [VALIDADO] — sem âncora normativa.
      Mesma presunção protetiva de R-AUD-01 sobre ruido_acima_acao, mesma marca
      [INTERPRETADO — prioridade na revisão de saída] (D-ARQ-68 cl.5); a perna
      'e' NÃO está na allowlist de presunção — ausência ali continua bloqueante."
    status: VALIDADO

  - id: R-AUD-04
    quando: todo_trabalhador
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [adm, per, MR, dem]}
    base_normativa: "NR-07 Anexo II 4.1: 'na admissão; anualmente; na demissão'
      [DERIVADO] crava 12M + adm + dem. O UNIVERSO da norma é o item 2 (acima do
      nível de ação conforme o PGR); estender a todo trabalhador e incluir MRO é
      [INTERPRETADO — revisão de saída], apoiado em matriz-precedente: Carolini
      07/2026 (SPE 0030) 41/41 audiometria e 38/41 com DEM; Patrícia 04/2025
      (RESERVA 0028) 44/44 audiometria, DEM confirmado 42, indeterminado 2 por
      forma ambígua de célula, sem DEM confirmado ZERO. Duas médicas, dois
      lados do corte NR-01 26/05/2026. LIMITE: ambos construção civil —
      reinspecionar no 1º PGR de saúde ou química (D-ARQ-06).
      [DEPRECATED — fundamento refutado por DT-003EY-01, sem sucessora — D-ARQ-81]:
      003.EY mediu 23 obras e refutou o precedente: universalidade em 7/23
      (6/23 com piso n_cargos ≥ 17), distribuição larga entre as não-universais.
      As duas matrizes-precedente de 003.EX eram justamente as duas em que a
      médica estendeu ao administrativo — artefato de amostra, não convergência.
      Momento DEM medido em 003.EZ passa a sair pela presunção de R-AUD-02
      (D-ARQ-68 cl.5), não mais por este piso incondicional."
    status: DEPRECATED

  - id: R-VIB-02
    quando: vibracao_qualquer
    emite:
      - {exame: audiometria, periodicidade_meses: 12, momentos: [adm, per, MR]}
    base_normativa: "Protocolo Dra. Carolini R-VIB-02 — qualquer vibracao (corpo inteiro ou maos-bracos) -> audiometria 12M mesmo abaixo do nivel de acao. Vibracao generica sem qualificar tipo -> Ausente -> bloqueante (D-ARQ-13/16)"
    status: VALIDADO

  - id: R-RX-01-adm
    quando: silica_asbesto_leo_ate_10
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 0
        momentos: [adm]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto CLSC ≤10% LEO: admissional; demissional se último exame > 2 anos (janela no agendador)"
    status: VALIDADO

  - id: R-RX-01-sem
    quando: silica_asbesto_sem_medicao
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 24
        periodicidade_apos_15a: 12
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto sem avaliação quantitativa; 24M, encurta para 12M após 15 anos (corte no agendador, D-ARQ-19); demissional se último > 1 ano. Sílica com avaliação qualitativa P×S no PGR sai deste ramo para R-RX-01-qual (DT-003EC-01); aqui fica o PGR silencioso e o asbesto."
    status: VALIDADO

  - id: R-RX-01-qual
    quando: silica_qualitativa
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 12
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "DT-003EC-01 — sílica sem avaliação quantitativa, COM avaliação
      qualitativa P×S na linha do risco no PGR -> 12M constante. [INTERPRETADO —
      prioridade na revisão de saída]: decisão do Diovanni (23/09/2026) sobre a
      conduta convergente das médicas nos 4 pares medidos — Patrícia (Porto Araras I
      06/07/26, 27/27 GHEs com sílica; Vila Brasil Escritório 26/08/26, 8/8) e
      Carolini (SPE 0030 Fascino 08/07/26). NÃO é [DERIVADO — NR]: o literal do
      Quadro 1 do Anexo III da NR-07 (Portaria MTP 567/2022, conferido em 003.EH) tem
      dois ramos e põe avaliação só qualitativa no ramo 'sem avaliações quantitativas'
      (24M, R-RX-01-sem); 12M é intervalo MENOR que o do ramo, mais protetivo, não
      contrário. Viés declarado (D-ARQ-81 cl.1): construção civil, 2 médicas; 24M
      aparece em 15/34 matrizes do acervo sem PGR para conferir o estado da sílica.
      Só sílica: asbesto qualitativo segue em R-RX-01-sem (sem medição nem decisão)."
    status: INTERPRETADO

  - id: R-RX-01-baixa
    quando: silica_asbesto_leo_10_50
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: 36
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto >10% e ≤50% LEO; 60M, encurta para 36M após 15 anos (D-ARQ-19); demissional se último > 2 anos"
    status: VALIDADO

  - id: R-RX-01-media
    quando: silica_asbesto_leo_50_100
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 36
        periodicidade_apos_15a: 24
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto >50% e ≤100% LEO; 36M, encurta para 24M após 15 anos (D-ARQ-19); demissional se último > 1 ano"
    status: VALIDADO

  - id: R-RX-01-alta
    quando: silica_asbesto_leo_acima_100
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 12
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 1 (Portaria MTP 567/2022), conferido no site do MTE [DERIVADO] — sílica/asbesto >100% LEO; 12M constante, sem corte de 15 anos; demissional se último > 1 ano"
    status: VALIDADO

  - id: R-RX-01-pnos
    quando: pnos
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "DEPRECATED (002.Y) — 60M único achatava as 4 faixas do Quadro 2. Sucedida por R-RX-01-pnos-ate10/-10a100/-acima100/-sem. Mantida por contrato de ID (rastreabilidade PCMSO). NR-07 Anexo III Quadro 2 (Portaria 567/2022)."
    status: DEPRECATED

  - id: R-RX-01-pnos-ate10
    quando: pnos_leo_ate_10
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 0
        momentos: [adm]
    base_normativa: "NR-07 Anexo III Quadro 2 (Portaria MTP 567/2022), conferido no MTE [DERIVADO] — PNOS CLSC ≤10% LEO (TLV-PNOS ACGIH 3 mg/m³ resp): só admissional."
    status: INTERPRETADO

  - id: R-RX-01-pnos-10a100
    quando: pnos_leo_10_100
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 0
        momentos: [adm]
    base_normativa: "NR-07 Anexo III Quadro 2 (Portaria MTP 567/2022) [DERIVADO] — PNOS 10% < CLSC ≤100% LEO: admissional. Repetição única após 5 anos a critério clínico NÃO materializada (lembrete operacional — DT-002Y-01). NÃO é 60M recorrente."
    status: INTERPRETADO

  - id: R-RX-01-pnos-acima100
    quando: pnos_leo_acima_100
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 2 (Portaria MTP 567/2022) [DERIVADO] — PNOS CLSC >100% LEO: adm + 60M (a cada 5 anos)."
    status: INTERPRETADO

  - id: R-RX-01-pnos-sem
    quando: pnos_sem_medicao
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III Quadro 2 (Portaria MTP 567/2022) [DERIVADO] — PNOS sem avaliação quantitativa: adm + 60M."
    status: INTERPRETADO

  - id: R-ESP-02
    quando: poeira_mineral
    emite:
      - exame: espirometria
        periodicidade_meses: 24
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "NR-07 Anexo III item 3.1 (Portaria MTP 567/2022): exposto a poeira
      mineral do inventário do PGR → espirometria no admissional e a cada dois anos.
      Momentos MR/dem [DERIVADO — matrizes Carolini 07/2026 e Patrícia 04/2025]; a norma
      crava só adm+per. Sucede R-ESP-01 (DEPRECATED)."
    status: DERIVADO

  - id: R-ESP-03
    quando: poeira_de_madeira
    emite:
      - exame: espirometria
        periodicidade_meses: 24
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "Poeira de madeira → espirometria 24M. SEM âncora no item 3.1 do Anexo III (que dispara por 'poeira mineral' — madeira é orgânica, fora do escopo textual de R-ESP-02) — origem matriz Patrícia, não norma conferida [INTERPRETADO]. Mesmo par de PGRs de R-RX-03 (GHE-08 Carpintaria Fascino 15.07.26, GHE-04 Carpintaria Aurora 27.08.26), mesma médica, mesmo valor: ambos Espirometria 24M. ID separada de R-ESP-02 por mudança de escopo de substância (mineral -> madeira), não faixa da mesma regra."
    status: INTERPRETADO

  - id: R-RX-02
    quando: fumos_metalicos
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "Fumos metálicos → RX OIT 60M. SEM âncora no Anexo III da NR-07 (fumos não é Quadro 1 nem Quadro 2) — origem matriz Patrícia/analogia, não norma conferida [INTERPRETADO]. DT-002K-02 firmou risco por metal individual (Mn/Cr⁶⁺), não categoria 'fumos'. Roteamento correto depende da decomposição em metais — ver DT-D3-02."
    status: INTERPRETADO

  - id: R-RX-03
    quando: poeira_de_madeira
    emite:
      - exame: rx_torax_oit
        periodicidade_meses: 60
        periodicidade_apos_15a: null
        momentos: [adm, per, MR, dem]
    base_normativa: "Poeira de madeira → RX OIT 60M. SEM âncora no Anexo III da NR-07 (não é sílica/asbesto/carvão do Quadro 1, nem PNOS do Quadro 2 — agente identificável, DT-003EJ-01) — origem IARC Monographs Vol.62/1995 e 100C/2012 (Grupo 1, carcinogênico p/ humanos) + matriz Patrícia, não norma brasileira conferida [INTERPRETADO]. Medido em 2 PGRs independentes, mesma médica, mesmo valor: GHE-08 Carpintaria (PGR CONSCIENTE SPE 0030 FASCINO, 15.07.26) e GHE-04 Carpintaria (PGR CMO Residencial Aurora Lago das Rosas, 27.08.26), ambos RX 60M. DT-003EJ-01 RESOLVIDA por esta regra."
    status: INTERPRETADO

  - id: R-PKG-BZ
    quando: benzeno
    emite:
      - {exame: hemograma,           periodicidade_meses: 6, momentos: [adm, per, MR, dem]}
      - {exame: reticulocitos,       periodicidade_meses: 6, momentos: [adm, per, MR, dem]}
      - {exame: acido_transmuconico, periodicidade_meses: 6, momentos: [per]}
    base_normativa: "Protocolo Dra. Carolini R-PKG-BZ — benzeno identificado na composição
      (via FDS, mesmo <5%, mesmo via CAS de aromáticos genéricos R-FDS-04) → pacote benzeno.
      hemograma 6M [adm/per/MR/dem] e t,t-mucônico 6M [per] [VALIDADO — R-PKG-BZ].
      reticulócitos: momentos [adm/per/MR/dem] do protocolo; periodicidade 6M
      [DERIVADO — analogia hemograma R-PKG-BZ] (protocolo declara momentos, não periodicidade).
      Dispara por identidade de agente, agnóstico à fonte (4ª fonte D-ARQ-35) e à materialidade."
    status: VALIDADO

  # R-BIO-05 [INTERPRETADO] (DT-003EB-02): nas R-BIO-04 do Quadro 1 (IBE/EE),
  # mencao_documental troca o indicador por observação quando todo risco do
  # agente no GHE vem classificado IRRELEVANTE na matriz P×S do PGR. BAIXO
  # emite (decisão do Diovanni, 24/09/2026). Quadro 2 (IBE/SC) sem a chave.
  - id: R-BIO-04-acetona
    quando: acetona
    mencao_documental: {regra: R-BIO-05, niveis_risco: [IRRELEVANTE]}
    emite:
      - {exame: acetona_urina, periodicidade_meses: 6, momentos: [per]}
    base_normativa: "R-BIO-04 — biomonitoramento por identidade de agente.
      NR-07 Anexo I Quadro 1 (IBE/EE): acetona → acetona na urina. Momento [per],
      periodicidade 6M [R-CLI-02 semestral]."
    status: VALIDADO

  - id: R-BIO-04-arsenio
    quando: arsenio
    mencao_documental: {regra: R-BIO-05, niveis_risco: [IRRELEVANTE]}
    emite:
      - {exame: arsenio_urina, periodicidade_meses: 6, momentos: [per]}
    base_normativa: "R-BIO-04 — biomonitoramento por identidade de agente.
      NR-07 Anexo I Quadro 1 (IBE/EE): arsênio → arsênio inorgânico + metabólitos
      metilados na urina. Momento [per], periodicidade 6M."
    status: VALIDADO

  - id: R-BIO-04-dissulfeto_de_carbono
    quando: dissulfeto_de_carbono
    mencao_documental: {regra: R-BIO-05, niveis_risco: [IRRELEVANTE]}
    emite:
      - {exame: ttca_urina, periodicidade_meses: 6, momentos: [per]}
    base_normativa: "R-BIO-04 — biomonitoramento por identidade de agente.
      NR-07 Anexo I Quadro 1 (IBE/EE): dissulfeto de carbono → TTCA na urina.
      Momento [per], periodicidade 6M."
    status: VALIDADO

  - id: R-BIO-04-estireno
    quando: estireno
    mencao_documental: {regra: R-BIO-05, niveis_risco: [IRRELEVANTE]}
    emite:
      - {exame: acido_mandelico_fenilglioxilico, periodicidade_meses: 6, momentos: [per]}
    base_normativa: "R-BIO-04 — biomonitoramento por identidade de agente.
