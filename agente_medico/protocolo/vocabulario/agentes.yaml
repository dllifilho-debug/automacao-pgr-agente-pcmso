    # [INTERPRETADO — prioridade na revisão de saída] A atribuição ao slug `esforco_fisico` é
    # a mais frouxa das duas desta fatia: a NR-17 trata levantamento/transporte em capítulo
    # próprio (17.5), distinto de "uso excessivo de força muscular" (17.4.3 "c"), e o
    # vocabulário não tem slug de levantamento de cargas. Decisão do Arquiteto: não criar slug
    # sem consumidor (precedente 003.DG-1). Inspecionar se algum PGR futuro distinguir os dois.
    # R-PGR-07 (proposta 003.FF) cl.3 — variação de forma inclui SUFIXO, não só a palavra-núcleo.
    # [MEDIDO — 003.FF, PGR ALT T65: o alias acima falha contra
    # "Levantamento e transporte manual de cargas ou volumes" apenas pelo sufixo " ou volumes";
    # Levenshtein ≤2 não alcança (11 caracteres de distância). Ver MEDICAO_003FF_par_T65.md §7,
    # citado ali como um dos dois casos que provam que o modo de falha não é "falta slug".]
