    # (MEDICAO_003FF_par_T65.md §4): "Postura incorreta de trabalho" (7 ocorrências) e o par de
    # grafias "Postura de pe por longos periodo" / "…periodos", que a nota de grafia do §4
    # registra no MESMO documento.
    # [MEDIDO — 003.FH, correção 003.FH-C3: o par NÃO difere por caixa nem por acento, difere
    # pelo SUFIXO "s". `normalizar_termo` colapsa caixa (casefold) e acento (NFKD), e nenhum dos
    # dois alcança "periodo" vs "periodos" — daí as duas entrarem como aliases distintos. Com um
    # alias só, a forma singular chegava a este slug pelo ramo FUZZY de D-ARQ-64 (distância 1,
    # `fuzzy_permitido: true` acima): mecanismo distinto e confiança distinta da EXATA que o
    # comentário anterior afirmava. O aviso do §4 é literal: "Qualquer solucao por alias literal
    # tem de aguentar isso".]
    # As outras 4 formas ficam [A MEDIR]: o PGR ALT T65 não está no acervo versionado
    # (DH-003FE-01) e o verbatim delas não foi transcrito para nenhum doc do repo.
