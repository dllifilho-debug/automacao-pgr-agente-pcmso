    # comentário anterior afirmava. O aviso do §4 é literal: "Qualquer solucao por alias literal
    # tem de aguentar isso".]
    # As outras 4 formas ficam [A MEDIR]: o PGR ALT T65 não está no acervo versionado
    # (DH-003FE-01) e o verbatim delas não foi transcrito para nenhum doc do repo.
