    # pontuação->espaço. As três colapsam em `silica_livre_poeira_respiravel`. Enumerar as 3
    # seria redundante e levantaria colisão-consigo-mesma em `construir_indice_termos`.
    # [MEDIDO — 003.FH, correção 003.FH-C3: os mecanismos são independentes e nenhum sozinho
    # cobre duas grafias. Sem o casefold cai só a caixa-alta; sem o NFKD cai só a forma sem
    # acento. O par sufixo de `postura_inadequada` não é desta classe — ver lá.]
    termos: ["Sílica livre", "Sílica livre cristalizada", "Sílica livre cristalina", "Quartzo", "Cristobalita", "Tridimita", "Sílica Livre - Poeira respirável"]
