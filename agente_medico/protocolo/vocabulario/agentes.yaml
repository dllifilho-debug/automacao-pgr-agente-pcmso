    # [DERIVADO — NR-07 Anexo III: o Quadro 1 trata de "poeira CONTENDO sílica" e o Quadro 2 mede
    # "poeira respirável". "Sílica Livre - Poeira respirável" NOMEIA a substância, logo resolve;
