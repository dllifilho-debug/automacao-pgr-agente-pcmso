# Vocabulário canônico de exames PCMSO.
# Fonte de verdade: Matriz Dra. Patrícia Montalvo 06/2025.
# Slug é estável; nome_exibicao pode evoluir sem migração.
#
# Esta sessão (002.D1) popula APENAS os exames atualmente referenciados
# em regras.yaml. Demais exames da matriz entram conforme novas regras
# forem adicionadas (sessões futuras).
#
# ordem_exibicao (003.EO EMENDA 1, D-ARQ-73): posição do exame na célula da
# matriz de saída. Ordem não é conduta clínica — nenhuma R-*/NR prescreve
# ordem de exibição — por isso o campo é opcional: só os slugs medidos na
# sequência majoritária de 17/19 GHEs do gabarito Fascino (08/07/26) o
# carregam; os demais saem depois, em ordem alfabética de slug (fallback do
# emissor, não deste arquivo). "Manganês no sangue" (manganes_sangue) entrou
# com R-BIO-03 (25/09/2026), grafia do gabarito Aurora Lago das Rosas.

