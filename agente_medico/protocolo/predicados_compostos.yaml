predicados_compostos:
  atividade_critica:
    ou:
      - altura
      - espaco_confinado
      - motorista_equipamento_pesado

  vibracao_qualquer:
    ou:
      - vibracao_corpo_inteiro
      - vibracao_mao_braco

  poeira_mineral:
    ou:
      - silica
      - asbesto
      - pnos

  # R-CLI-05 perna (a): cancerígeno IARC 1/2A com indicador biológico no Anexo I da
  # NR-07, em qualquer nível. Lista = gabarito 003.DP (docs/referencia/
  # GABARITO_003DP_anexo11-12_iarc.md) ∩ agentes com tipo_ibe; explícita porque o campo
  # is_carcinogeno_iarc do vocabulário diverge do 003.DP. Chumbo e inseticidas ficaram
  # ESCALAR no 003.DP e só entram pela perna (b).
  cancerigeno_com_ibe:
    ou:
      - arsenio
      - benzeno
      - butadieno_13
      - cadmio
      - cromo_hexavalente
      - diclorometano
      - dimetilformamida
      - estireno
      - oxido_de_etileno
      - tetracloroetileno
      - tricloroetileno

  # R-VIS-01-solda: indicador de solda no GHE. Os PGRs não trazem "solda" como agente —
  # só na fonte geradora ("fumos e gases de soldagem", eletrodo E-6013); o agente de solda
  # que resolve nos casos reais é o manganês do eletrodo (Aurora GHE 16, Fascino GHE 17).
  # [INTERPRETADO]: manganês é marcador da atividade, não o risco que justifica o exame
  # (a radiação UV/IR do arco).
  solda_indicador:
    ou:
      - manganes
      - fumos_metalicos

